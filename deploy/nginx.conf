server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location = /data/snapshot.json {
        alias /var/lib/antscoper/public/snapshot.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        error_page 404 =503 /schedule-unavailable.json;
    }
    location = /data/status.json {
        alias /var/lib/antscoper/public/status.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        error_page 404 =503 /schedule-unavailable.json;
    }
    location = /schedule-unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"error":"Schedules are temporarily unavailable. Please retry."}';
    }
    location ~ ^/(backups|private|\.runtime)(/|$) { return 404; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
