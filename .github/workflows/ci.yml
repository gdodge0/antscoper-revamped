name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test --workspace frontend
      - run: npm run build
  worker:
    name: Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/import_campus.py --check
      - run: python -B scripts/import_terrain.py --check
  browser-tests:
    name: Browser (${{ matrix.suite }}, ${{ matrix.viewport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [campus, journeys]
        viewport:
          [desktop, phone, small-phone, narrow-phone, tablet, small-desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
        working-directory: frontend
      - run: npx playwright install chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
      - run: npm run test:browser:${{ matrix.suite }} -- --project=${{ matrix.viewport }}
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-results-${{ matrix.suite }}-${{ matrix.viewport }}
          path: test-results/browser
          retention-days: 7
  browser:
    name: Browser
    if: always()
    needs: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser suite and viewport
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          if [ "$BROWSER_RESULT" != "success" ]; then
            echo "::error::One or more browser suites failed or did not complete."
            exit 1
          fi
  containers:
    name: Containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: docker build -f deploy/frontend.Dockerfile --build-arg SOURCE_COMMIT=${{ github.sha }} -t antscoper-test-web .
      - run: docker build -f deploy/worker.Dockerfile -t antscoper-test-worker .
      - run: python -B -m tests.container_smoke
